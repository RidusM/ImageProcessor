basePath: /
definitions:
  handlers.ErrorResponse:
    properties:
      code:
        example: not_found
        type: string
      details:
        example: image with id abc123 does not exist
        type: string
      error:
        example: image not found
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      status:
        example: ok
        type: string
      time:
        example: "2024-01-15T10:30:00Z"
        type: string
    type: object
  handlers.ImageStatusResponse:
    properties:
      created_at:
        example: "2024-01-15T10:30:00Z"
        type: string
      error:
        example: resize failed
        type: string
      filename:
        example: photo.jpg
        type: string
      id:
        example: a1b2c3d4e5f6
        type: string
      progress:
        example: 45
        type: integer
      status:
        example: processing
        type: string
      updated_at:
        example: "2024-01-15T10:30:05Z"
        type: string
    type: object
  handlers.UploadResponse:
    properties:
      filename:
        example: photo.jpg
        type: string
      id:
        example: a1b2c3d4e5f6
        type: string
      message:
        example: Image uploaded successfully
        type: string
      size:
        example: 2048576
        type: integer
      status:
        example: pending
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: stormkillpeople@gmail.com
    name: RidusM
  description: API для работы с обработчиком изображений
  license:
    name: MIT-0
    url: https://github.com/aws/mit-0
  termsOfService: http://swagger.io/terms/
  title: Image Processor Service API
  version: "1.0"
paths:
  /health:
    get:
      description: Проверка доступности сервиса
      produces:
      - application/json
      responses:
        "200":
          description: Сервис доступен
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - System
  /image/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет изображение и все его версии (оригинал, обработанное, миниатюру)
      parameters:
      - description: ID изображения
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Изображение удалено
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Удалить изображение
      tags:
      - Image
    get:
      description: Возвращает обработанное изображение или статус задачи
      parameters:
      - description: ID изображения
        in: path
        name: id
        required: true
        type: string
      - default: processed
        description: 'Версия: processed|original|thumb'
        in: query
        name: version
        type: string
      produces:
      - application/json
      - image/jpeg
      - image/png
      responses:
        "200":
          description: Обработанное изображение
          schema:
            type: file
        "202":
          description: Изображение ещё обрабатывается
          schema:
            $ref: '#/definitions/handlers.ImageStatusResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Изображение не найдено
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Получить изображение или статус
      tags:
      - Image
  /image/{id}/status:
    get:
      consumes:
      - application/json
      description: Возвращает текущий статус задачи обработки изображения
      parameters:
      - description: ID изображения
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Обработка завершена
          schema:
            $ref: '#/definitions/handlers.ImageStatusResponse'
        "202":
          description: Обработка в процессе
          schema:
            $ref: '#/definitions/handlers.ImageStatusResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Задача не найдена
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Получить статус обработки
      tags:
      - Image
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: Загружает изображение на обработку (ресайз, миниатюра, водяной
        знак)
      parameters:
      - description: Файл изображения
        in: formData
        name: image
        required: true
        type: file
      - description: JSON с опциями обработки
        in: formData
        name: options
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Изображение принято в обработку
          schema:
            $ref: '#/definitions/handlers.UploadResponse'
        "400":
          description: Ошибка валидации
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Файл слишком большой
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Загрузить изображение
      tags:
      - Image
swagger: "2.0"
