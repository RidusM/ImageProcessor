<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMG PROCESSOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #222;
      --accent: #e8ff47;
      --accent2: #ff4747;
      --text: #f0f0f0;
      --muted: #555;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 40px 0 48px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }
    header h1 {
      font-family: var(--sans);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }
    header h1 span { color: var(--accent); }
    .badge {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 4px 8px;
    }

    .upload-section {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 24px;
      margin-bottom: 64px;
    }
    @media (max-width: 700px) { .upload-section { grid-template-columns: 1fr; } }

    .drop-zone {
      border: 1px dashed var(--muted);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
      background: rgba(255,255,255,.01);
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(232,255,71,.03); }
    .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop-icon { font-size: 40px; margin-bottom: 16px; display: block; }
    .drop-zone p { color: var(--muted); font-size: 13px; line-height: 1.8; }
    .drop-zone strong { color: var(--text); display: block; margin-bottom: 8px; font-size: 15px; }

    .upload-options { display: flex; flex-direction: column; gap: 16px; }
    .opt-group label {
      display: block; font-size: 10px; letter-spacing: 2px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
    }
    .opt-group input[type=number] {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: 13px; padding: 8px 12px; outline: none;
    }
    .opt-group input[type=number]:focus { border-color: var(--accent); }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .toggle { width: 36px; height: 20px; background: var(--border); border-radius: 10px; position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
    .toggle.on { background: var(--accent); }
    .toggle::after { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; background: var(--bg); border-radius: 50%; transition: transform .2s; }
    .toggle.on::after { transform: translateX(16px); }

    .btn-upload {
      margin-top: auto; background: var(--accent); color: #000; border: none;
      padding: 14px; font-family: var(--sans); font-weight: 700; font-size: 14px;
      letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
      transition: opacity .2s, transform .1s; width: 100%;
    }
    .btn-upload:hover { opacity: .85; }
    .btn-upload:active { transform: scale(.98); }
    .btn-upload:disabled { opacity: .4; cursor: default; }

    .section-title { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .section-title h2 { font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
    .section-title .count { background: var(--accent); color: #000; font-size: 10px; font-weight: 700; padding: 2px 7px; font-family: var(--mono); }
    .line { flex: 1; height: 1px; background: var(--border); }

    .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

    .card { background: var(--surface); border: 1px solid var(--border); overflow: hidden; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .card-thumb { width: 100%; aspect-ratio: 16/10; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-thumb .placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .card-thumb .placeholder .icon { font-size: 28px; }

    .status-badge { position: absolute; top: 8px; right: 8px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 8px; font-family: var(--mono); font-weight: 700; }
    .status-badge.pending  { background: #333; color: var(--muted); }
    .status-badge.processing { background: #1a1a00; color: var(--accent); animation: pulse 1.2s infinite; }
    .status-badge.done     { background: #001a00; color: #47ff7a; }
    .status-badge.error    { background: #1a0000; color: var(--accent2); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .progress-bar { height: 2px; background: var(--border); position: relative; overflow: hidden; }
    .progress-bar .fill { height: 100%; background: var(--accent); transition: width .4s ease; }
    .progress-bar.indeterminate .fill { width: 40% !important; animation: slide 1.2s infinite ease-in-out; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

    .card-body { padding: 12px 14px 14px; }
    .card-id { font-size: 10px; color: var(--muted); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-filename { font-size: 13px; color: var(--text); margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-actions { display: flex; gap: 8px; }

    .btn { flex: 1; padding: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
    .btn:hover { color: var(--text); border-color: var(--muted); }
    .btn.danger:hover { color: var(--accent2); border-color: var(--accent2); }
    .btn.primary { border-color: var(--accent); color: var(--accent); }
    .btn.primary:hover { background: var(--accent); color: #000; }
    .btn:disabled { opacity: .3; cursor: default; pointer-events: none; }

    .version-tabs { display: flex; margin-bottom: 8px; }
    .vtab { flex: 1; padding: 5px; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-family: var(--mono); margin-right: -1px; transition: color .15s, background .15s; }
    .vtab.active { background: var(--border); color: var(--text); z-index: 1; position: relative; }

    #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
    .toast { background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; font-size: 12px; max-width: 300px; animation: toastIn .25s ease; }
    .toast.ok  { border-left: 3px solid #47ff7a; }
    .toast.err { border-left: 3px solid var(--accent2); }
    .toast.info{ border-left: 3px solid var(--accent); }
    @keyframes toastIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }

    .empty { text-align: center; padding: 80px 0; color: var(--muted); font-size: 13px; grid-column: 1/-1; }
    .empty .big { font-size: 48px; display: block; margin-bottom: 16px; }

    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 80vh; object-fit: contain; border: 1px solid var(--border); }
    #lightbox-close { position: absolute; top: 24px; right: 24px; background: none; border: 1px solid var(--border); color: var(--text); font-size: 20px; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>IMG<span>.</span>PROC</h1>
    <span class="badge">v1.0 · async processor</span>
  </header>

  <div class="upload-section">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" />
      <span class="drop-icon">⬆</span>
      <strong id="dropLabel">Перетащите файл или нажмите для выбора</strong>
      <p>JPG, PNG, GIF, WEBP · макс. 32 МБ</p>
    </div>
    <div class="upload-options">
      <div class="opt-group">
        <label>Макс. ширина (px)</label>
        <input type="number" id="optWidth" placeholder="1920" min="1" max="9999" />
      </div>
      <div class="opt-group">
        <label>Размер миниатюры (px)</label>
        <input type="number" id="optThumb" placeholder="300" min="1" max="2000" />
      </div>
      <div class="toggle-row">
        <span>Водяной знак</span>
        <div class="toggle on" id="toggleWatermark"></div>
      </div>
      <button class="btn-upload" id="btnUpload" disabled>Загрузить →</button>
    </div>
  </div>

  <div class="section-title">
    <h2>Изображения</h2>
    <span class="count" id="countBadge">0</span>
    <div class="line"></div>
  </div>

  <div class="images-grid" id="grid">
    <div class="empty"><span class="big">◻</span>Ещё нет загруженных изображений</div>
  </div>
</div>

<div id="lightbox">
  <button id="lightbox-close">✕</button>
  <img id="lightboxImg" src="" alt="preview" />
</div>
<div id="toast-container"></div>

<script>
  const items = {};
  const pollers = {};

  const dropZone    = document.getElementById('dropZone');
  const fileInput   = document.getElementById('fileInput');
  const dropLabel   = document.getElementById('dropLabel');
  const btnUpload   = document.getElementById('btnUpload');
  const optWidth    = document.getElementById('optWidth');
  const optThumb    = document.getElementById('optThumb');
  const toggleWm    = document.getElementById('toggleWatermark');
  const grid        = document.getElementById('grid');
  const countBadge  = document.getElementById('countBadge');
  const lightbox    = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  let watermark = true;
  let selectedFile = null;

  toggleWm.addEventListener('click', () => {
    watermark = !watermark;
    toggleWm.classList.toggle('on', watermark);
  });

  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    selectedFile = f;
    dropLabel.textContent = f.name;
    btnUpload.disabled = false;
  });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    selectedFile = f;
    dropLabel.textContent = f.name;
    btnUpload.disabled = false;
  });

  btnUpload.addEventListener('click', async () => {
    if (!selectedFile) return;
    btnUpload.disabled = true;
    const fd = new FormData();
    fd.append('file', selectedFile);
    const opts = { add_watermark: watermark };
    if (optWidth.value) opts.resize_width = parseInt(optWidth.value);
    if (optThumb.value) opts.thumbnail_size = parseInt(optThumb.value);
    fd.append('options', JSON.stringify(opts));
    try {
      const res = await fetch('/upload', { method: 'POST', body: fd });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.details || err.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      addItem({ id: data.id, filename: data.filename || selectedFile.name, status: data.status || 'pending', progress: 0 });
      toast(`Загружено: ${data.filename || selectedFile.name}`, 'ok');
      startPolling(data.id);
      selectedFile = null;
      fileInput.value = '';
      dropLabel.textContent = 'Перетащите файл или нажмите для выбора';
    } catch (e) {
      toast(`Ошибка: ${e.message}`, 'err');
    }
    btnUpload.disabled = false;
  });

  function addItem(item) {
    items[item.id] = { version: 'processed', ...item };
    renderGrid();
  }

  function startPolling(id) {
    if (pollers[id]) return;
    pollers[id] = setInterval(async () => {
      try {
        const res = await fetch(`/image/${id}/status`);
        if (!res.ok) return;
        const data = await res.json();
        const prev = items[id];
        if (!prev) return;
        items[id] = { ...prev, status: data.status, progress: data.progress ?? prev.progress };
        renderCard(id);
        if (data.status === 'done' || data.status === 'error') {
        clearInterval(pollers[id]);
        delete pollers[id];
        if (data.status === 'done') {
            toast('Обработка завершена', 'ok');
            items[id] = { ...items[id], status: data.status, progress: data.progress ?? 100 };
            renderCard(id);                      
            setTimeout(() => loadThumb(id), 50);
    }   else {
            toast('Ошибка обработки', 'err');
    }
}
      } catch {}
    }, 2000);
  }

  function loadThumb(id) {
    const item = items[id];
    if (!item) return;
    const el = document.getElementById(`thumb-${id}`);
    if (!el) return;
    const url = `/image/${id}?version=${item.version}&t=${Date.now()}`;
    el.innerHTML = `<img src="${url}" alt="image" onerror="this.parentElement.innerHTML='<div class=placeholder><span class=icon>✕</span><span>Ошибка</span></div>'" />`;
  }

  function renderGrid() {
    const ids = Object.keys(items);
    countBadge.textContent = ids.length;
    if (ids.length === 0) {
      grid.innerHTML = `<div class="empty"><span class="big">◻</span>Ещё нет загруженных изображений</div>`;
      return;
    }
    grid.innerHTML = '';
    ids.slice().reverse().forEach(id => grid.appendChild(buildCard(id)));
  }

  function renderCard(id) {
    const existing = document.getElementById(`card-${id}`);
    if (!existing) { renderGrid(); return; }
    existing.replaceWith(buildCard(id));
  }

  function buildCard(id) {
    const item = items[id];
    const isDone = item.status === 'done';
    const isErr  = item.status === 'error';
    const isPending = item.status === 'pending' || item.status === 'processing';
    const prog = item.progress || 0;
    const statusLabel = { pending: '⏳ ожидание', processing: '⚙ обработка', done: '✓ готово', error: '✕ ошибка' }[item.status] || item.status;

    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${id}`;

    const thumbContent = isDone
      ? `<img src="/image/${id}?version=${item.version}&t=${Date.now()}" alt="img" onerror="this.parentElement.innerHTML='<div class=placeholder><span class=icon>✕</span></div>'" />`
      : `<div class="placeholder"><span class="icon">${isErr ? '✕' : '◌'}</span><span>${isErr ? 'Ошибка' : 'Обработка…'}</span></div>`;

    const tabsHTML = isDone ? `
      <div class="version-tabs">
        ${['processed','original','thumb'].map(v =>
          `<button class="vtab${item.version===v?' active':''}" onclick="switchVersion('${id}','${v}')">${{processed:'итог',original:'оригинал',thumb:'мини'}[v]}</button>`
        ).join('')}
      </div>` : '';

    card.innerHTML = `
      <div id="thumb-${id}" class="card-thumb">${thumbContent}</div>
      <span class="status-badge ${item.status}">${statusLabel}</span>
      <div class="progress-bar${isPending?' indeterminate':''}"><div class="fill" style="width:${prog}%"></div></div>
      <div class="card-body">
        <div class="card-id">${id}</div>
        <div class="card-filename">${item.filename}</div>
        ${tabsHTML}
        <div class="card-actions">
          <button class="btn primary" ${!isDone?'disabled':''} onclick="openLightbox('${id}')">Открыть</button>
          <button class="btn" ${!isDone?'disabled':''} onclick="downloadImg('${id}')">↓ Скачать</button>
          <button class="btn danger" onclick="deleteImg('${id}')">Удалить</button>
        </div>
      </div>`;
    return card;
  }

  function switchVersion(id, ver) {
    items[id].version = ver;
    renderCard(id);
    loadThumb(id);
  }

  function openLightbox(id) {
    const item = items[id];
    if (!item) return;
    lightboxImg.src = `/image/${id}?version=${item.version}&t=${Date.now()}`;
    lightbox.classList.add('open');
  }
  document.getElementById('lightbox-close').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('open'); });

  function downloadImg(id) {
    const item = items[id];
    const a = document.createElement('a');
    a.href = `/image/${id}?version=${item.version}&t=${Date.now()}`;
    a.download = `${item.filename}_${item.version}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

  async function deleteImg(id) {
    if (pollers[id]) { clearInterval(pollers[id]); delete pollers[id]; }
    try { await fetch(`/image/${id}`, { method: 'DELETE' }); } catch {}
    delete items[id];
    renderGrid();
    toast('Изображение удалено', 'info');
  }

  async function loadExistingImages() {
    try {
        const res = await fetch('/images');
        if (!res.ok) return;
        const list = await res.json();
        if (!list || !list.length) return;
       list.forEach(img => {
    if (items[img.ID]) return;
    items[img.ID] = {
        id: img.ID,
        filename: img.OriginalName || img.filename || img.Filename || img.ID,
        status: img.Status,
        progress: img.Progress,
        version: 'processed',
    };
            if (img.Status === 'pending' || img.Status === 'processing') {
                startPolling(img.ID);
            }
        });
        renderGrid();
        Object.keys(items).forEach(id => {
            if (items[id].status === 'done') {
                setTimeout(() => loadThumb(id), 100);
            }
        });
    } catch {}
}

loadExistingImages();

  function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
</script>
</body>
</html>
